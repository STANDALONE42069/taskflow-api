apiVersion: v1
kind: Pod
metadata:
  namespace: jenkins-agents
  labels:
    app.kubernetes.io/part-of: taskflow-lab10
    taskflow.dev/agent-profile: deploy
spec:
  serviceAccountName: jenkins-deployer
  automountServiceAccountToken: true
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node
      image: node:24-alpine3.24
      command: ["sh", "-c", "cat"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    - name: tools
      image: localhost:5001/taskflow-lab10-tools:2
      command: ["/bin/sh", "-c", "sleep infinity"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
