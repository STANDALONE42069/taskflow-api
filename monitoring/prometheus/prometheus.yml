global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/jenkins-slo.yml

scrape_configs:
  - job_name: jenkins
    metrics_path: /prometheus/
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:8081"]
    # Enable after creating the read-only Jenkins service user and local token file.
    # basic_auth:
    #   username: prometheus
    #   password_file: /etc/prometheus/secrets/jenkins-prometheus-token
